<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Source Sans 3', 'DejaVu Sans', sans-serif">
  <rect width="1000" height="640" fill="#FFFFFF"/>
  <rect x="40" y="16" width="360" height="608" rx="34" fill="#FFFFFF" stroke="#8A93A6" stroke-width="2"/>
  <line x1="40" y1="108" x2="400" y2="108" stroke="#8A93A6" stroke-width="2"/>
