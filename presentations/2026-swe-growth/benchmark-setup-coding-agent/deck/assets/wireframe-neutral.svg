  <rect x="64" y="540" width="312" height="62" rx="8" fill="#EEF0F4" stroke="#8A93A6" stroke-width="2"/>
  <text x="220" y="581" font-size="28" font-weight="700" fill="#6B7487" text-anchor="middle">Save</text>

  <g stroke="#1F4FE0" stroke-width="2" fill="none">
    <line x1="260" y1="76" x2="452" y2="76"/>
    <line x1="236" y1="180" x2="452" y2="196"/>
    <line x1="368" y1="416" x2="452" y2="360"/>
